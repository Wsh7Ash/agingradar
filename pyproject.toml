[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agingradar"
version = "0.1.0"
description = "Invoice aging buckets, chase priority scores and dunning reports (markdown, CSV, HTML) from a CSV."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["invoicing", "accounts-receivable", "aging", "dunning", "bookkeeping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Business",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
agingradar = "agingradar.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]